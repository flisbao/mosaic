[package]
name = "mosaic"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal dashboard built from pluggable widgets"
license = "MIT"

[lib]
name = "mosaic"
path = "src/lib.rs"

[[bin]]
name = "mosaic"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.1"
crossterm = "0.29"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.1"
thiserror = "2"
dirs = "7"
unicode-width = "0.2"
signal-hook = "0.3.18"

[dev-dependencies]
tempfile = "3"
