version = "0.0.5"
min_mosaic_version = "0.0.10"
plugin = "jira"
script = "plugins/jira/jira.py"
default_id = "jira"
interval_seconds = 120
timeout_seconds = 45
testing_only = ["JIRA_BASE_URL"]

[[steps]]
kind = "variable"
name = "JIRA_SITE"
prompt = "Host do site do Jira, sem https:// (ex.: empresa.atlassian.net)"
prompt_en = "Jira site host, without https:// (e.g. company.atlassian.net)"
required = true

[[steps]]
kind = "variable"
name = "JIRA_EMAIL"
prompt = "E-mail da conta dona do token"
prompt_en = "Email of the account that owns the token"
required = true

[[steps]]
kind = "secret"
prompt = "Token de API do Jira (crie em id.atlassian.com)"
prompt_en = "Jira API token (create it at id.atlassian.com)"
environment_key = "JIRA_TOKEN_ENV"
file_key = "JIRA_TOKEN_FILE"
required = true

[[steps]]
kind = "argument"
flag = "--jql"
prompt = "Consulta JQL do widget"
prompt_en = "Widget JQL query"
required = true

[[steps]]
kind = "argument"
flag = "--title"
prompt = "Título do widget"
prompt_en = "Widget title"
default = "Jira"

[[steps]]
kind = "argument"
flag = "--group-by"
prompt = "Agrupar o detalhe por"
prompt_en = "Group the detail by"
type = "choice"
default = "none"
choices = [
  { value = "none", description = "sem agrupamento", description_en = "no grouping" },
  { value = "assignee", description = "por responsável", description_en = "by assignee" },
  { value = "status", description = "por status", description_en = "by status" },
  { value = "priority", description = "por prioridade", description_en = "by priority" },
]

[[steps]]
kind = "argument"
flag = "--view"
prompt = "Como mostrar os issues"
prompt_en = "How to show the issues"
type = "choice"
default = "lines"
choices = [
  { value = "lines", description = "uma linha por issue", description_en = "one line per issue" },
  { value = "table", description = "tabela", description_en = "table" },
  { value = "stat", description = "só as contagens", description_en = "counts only" },
]

[[steps]]
kind = "argument"
flag = "--columns"
prompt = "Colunas da tabela: key, summary, status, assignee, priority, updated"
prompt_en = "Table columns: key, summary, status, assignee, priority, updated"
type = "list"
default = "key,summary,status,assignee"
when = { variable = "--view", in = ["table"] }

[[steps]]
kind = "argument"
flag = "--max-issues"
prompt = "Máximo de issues buscados"
prompt_en = "Maximum issues fetched"
type = "integer"
min = 1
max = 500
default = "100"

[[steps]]
kind = "variable"
name = "JIRA_STATE_DIR"
prompt = "Pasta do cache offline"
prompt_en = "Offline cache folder"
default = "~/.local/state/mosaic/jira"
advanced = true

[[steps]]
kind = "variable"
name = "JIRA_BUDGET_SECONDS"
prompt = "Orçamento interno de tempo, em segundos (menor que o tempo máximo do widget)"
prompt_en = "Internal time budget, in seconds (lower than the widget timeout)"
type = "integer"
min = 1
max = 3600
default = "40"
advanced = true

[[notes]]
text = "O valor do token fica fora do mosaic.toml: exporte a variável (ou grave o arquivo com chmod 600) antes de abrir o mosaic."
text_en = "The token value stays out of mosaic.toml: export the variable (or write the file with chmod 600) before opening mosaic."

[[presets]]
name = "minhas-tarefas"
description = "o que está atribuído a você e ainda não terminou"
description_en = "what is assigned to you and not finished yet"
id = "jira-minhas-tarefas"
arguments = { "--jql" = "assignee = currentUser() AND statusCategory != Done ORDER BY updated DESC", "--title" = "Minhas tarefas" }

[[presets]]
name = "time-em-andamento"
description = "o que cada pessoa do projeto está pegando agora, agrupado por responsável, em tabela"
description_en = "what each person on the project is working on now, grouped by assignee, as a table"
id = "jira-time-em-andamento"
arguments = { "--jql" = 'project = {project} AND statusCategory = "In Progress"', "--title" = "Time em andamento", "--group-by" = "assignee", "--view" = "table", "--columns" = "key,summary,status" }
inputs = [{ name = "project", prompt = "Chave do projeto (ex.: VHPJ)", prompt_en = "Project key (e.g. VHPJ)" }]

[[presets]]
name = "time"
description = "issues abertos de uma lista fixa de pessoas, agrupados por responsável"
description_en = "open issues of a fixed list of people, grouped by assignee"
id = "jira-time"
arguments = { "--jql" = "assignee in ({emails}) AND statusCategory != Done", "--title" = "Time", "--group-by" = "assignee" }
inputs = [{ name = "emails", prompt = "E-mails das pessoas, separados por vírgula", prompt_en = "People's emails, separated by commas", quote_list = true }]

[[presets]]
name = "sem-dono"
description = "issues a fazer sem responsável há mais de duas horas, só a contagem"
description_en = "to-do issues with no assignee for more than two hours, count only"
id = "jira-sem-dono"
arguments = { "--jql" = 'assignee is EMPTY AND statusCategory = "To Do" AND created <= -2h', "--title" = "Sem dono", "--view" = "stat" }

[[presets]]
name = "sprint"
description = "sprint aberto de um projeto, agrupado por status"
description_en = "open sprint of a project, grouped by status"
id = "jira-sprint"
arguments = { "--jql" = "sprint in openSprints() AND project = {project}", "--title" = "Sprint", "--group-by" = "status" }
inputs = [{ name = "project", prompt = "Chave do projeto (ex.: VHPJ)", prompt_en = "Project key (e.g. VHPJ)" }]

[[presets]]
name = "filtro-salvo"
description = "um filtro salvo no Jira (o número está na URL do filtro)"
description_en = "a saved Jira filter (the number is in the filter URL)"
id = "jira-filtro"
arguments = { "--jql" = "filter = {filter}", "--title" = "Meu filtro" }
inputs = [{ name = "filter", prompt = "Número do filtro", prompt_en = "Filter number" }]
