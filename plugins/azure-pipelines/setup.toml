version = "0.0.5"
min_mosaic_version = "0.0.10"
plugin = "azure-pipelines"
script = "plugins/azure-pipelines/azure_pipelines.py"
default_id = "azure-pipelines"
interval_seconds = 900
timeout_seconds = 60
testing_only = ["AZDO_BASE_URL", "AZDO_LOGIN_URL", "AZDO_IMDS_URL"]

[[steps]]
kind = "variable"
name = "AZDO_ORGANIZATION"
prompt = "Nome da organização do Azure DevOps (só o nome, sem URL)"
prompt_en = "Azure DevOps organization name (just the name, no URL)"
required = true

[[steps]]
kind = "variable"
name = "AZDO_PIPELINES_FILE"
prompt = "Catálogo de pipelines: caminho de um arquivo .ini com a URL de cada pipeline (Enter = varrer os projetos, sem catálogo)"
prompt_en = "Pipeline catalog: path of an .ini file with the URL of each pipeline (Enter = scan the projects, no catalog)"

[[steps]]
kind = "variable"
name = "AZDO_PIPELINE_WATCH"
prompt = "Quais pipelines do catálogo monitorar: nomes, projeto/repositório ou projeto/* (Enter = todas)"
prompt_en = "Which catalog pipelines to watch: names, project/repository or project/* (Enter = all)"
type = "list"
when = { variable = "AZDO_PIPELINES_FILE", present = true }

[[steps]]
kind = "variable"
name = "AZDO_PROJECTS"
prompt = "Projetos, pelo nome exato (Enter = todos os projetos da organização, até 50; custa uma requisição de builds por projeto)"
prompt_en = "Projects, by exact name (Enter = every project of the organization, up to 50; costs one builds request per project)"
type = "list"
when = { variable = "AZDO_PIPELINES_FILE", present = false }

[[steps]]
kind = "variable"
name = "AZDO_PIPELINE_DAYS"
prompt = "Janela de histórico, em dias"
prompt_en = "History window, in days"
type = "integer"
min = 1
max = 90
default = "14"

[[steps]]
kind = "variable"
name = "AZDO_PIPELINE_TOP"
prompt = "Quantas pipelines entram no ranking"
prompt_en = "How many pipelines enter the ranking"
type = "integer"
min = 1
max = 10
default = "5"

[[steps]]
kind = "variable"
name = "AZDO_PIPELINE_SAMPLE"
prompt = "Quantas execuções recentes de cada pipeline entram na análise dos passos"
prompt_en = "How many recent runs of each pipeline enter the step analysis"
type = "integer"
min = 1
max = 20
default = "10"

[[steps]]
kind = "variable"
name = "AZDO_AUTH_METHOD"
prompt = "Como o widget se autentica no Entra"
prompt_en = "How the widget authenticates with Entra"
type = "choice"
default = "azure-cli"
choices = [
  { value = "azure-cli", description = "usa o az login da sua máquina (padrão)", description_en = "uses the az login of your machine (default)" },
  { value = "device-code", description = "login uma vez no terminal, com um app registrado no Entra", description_en = "log in once in the terminal, with an app registered in Entra" },
  { value = "service-principal", description = "automação fora do Azure, com o segredo de um app", description_en = "automation outside Azure, with an app secret" },
  { value = "managed-identity", description = "Mosaic rodando numa VM do Azure", description_en = "Mosaic running on an Azure VM" },
]

[[steps]]
kind = "variable"
name = "AZDO_TENANT_ID"
prompt = "Directory (tenant) ID (padrão: organizations)"
prompt_en = "Directory (tenant) ID (default: organizations)"
when = { variable = "AZDO_AUTH_METHOD", in = ["azure-cli", "device-code", "service-principal"] }
required_when = { variable = "AZDO_AUTH_METHOD", in = ["service-principal"] }

[[steps]]
kind = "variable"
name = "AZDO_CLIENT_ID"
prompt = "Application (client) ID do app registrado no Entra (na managed-identity, só para identidade atribuída pelo usuário)"
prompt_en = "Application (client) ID of the app registered in Entra (with managed-identity, only for a user-assigned identity)"
when = { variable = "AZDO_AUTH_METHOD", in = ["device-code", "service-principal", "managed-identity"] }
required_when = { variable = "AZDO_AUTH_METHOD", in = ["device-code", "service-principal"] }

[[steps]]
kind = "secret"
prompt = "Segredo do app registrado no Entra"
prompt_en = "Secret of the app registered in Entra"
environment_key = "AZDO_CLIENT_SECRET_ENV"
file_key = "AZDO_CLIENT_SECRET_FILE"
required = true
when = { variable = "AZDO_AUTH_METHOD", in = ["service-principal"] }

[[steps]]
kind = "variable"
name = "AZDO_TITLE"
prompt = "Título do widget"
prompt_en = "Widget title"
default = "Pipelines lentas"

[[steps]]
kind = "variable"
name = "AZDO_CREDENTIALS_DIR"
prompt = "Pasta (0700) do refresh token do device-code"
prompt_en = "Folder (0700) of the device-code refresh token"
default = "~/.local/state/mosaic/azure-devops-credentials"
advanced = true
when = { variable = "AZDO_AUTH_METHOD", in = ["device-code"] }

[[steps]]
kind = "variable"
name = "AZDO_STATE_DIR"
prompt = "Pasta do estado do widget (cache offline e cache de timelines)"
prompt_en = "Widget state folder (offline cache and timelines cache)"
default = "~/.local/state/mosaic/azure-pipelines"
advanced = true

[[notes]]
text = "A identidade precisa de acesso Basic na organização e permissão de leitura de Build nos projetos."
text_en = "The identity needs Basic access in the organization and Build read permission in the projects."

[[notes]]
text = "azure-cli: o mosaic precisa achar o az no PATH e ler ~/.azure; se você usa AZURE_CONFIG_DIR, liste-a em inherit_env."
text_en = "azure-cli: mosaic must find az in PATH and read ~/.azure; if you use AZURE_CONFIG_DIR, list it in inherit_env."
when = { variable = "AZDO_AUTH_METHOD", in = ["azure-cli"] }

[[notes]]
text = "device-code: rode o login uma vez, no terminal, com as mesmas variáveis do widget: python3 ~/.config/mosaic/plugins/azure-pipelines/azure_pipelines.py login"
text_en = "device-code: run the login once, in the terminal, with the same variables as the widget: python3 ~/.config/mosaic/plugins/azure-pipelines/azure_pipelines.py login"
when = { variable = "AZDO_AUTH_METHOD", in = ["device-code"] }

[[notes]]
text = "service-principal: exporte a variável do segredo antes de abrir o mosaic; o valor nunca vai para o mosaic.toml."
text_en = "service-principal: export the secret variable before opening mosaic; the value never goes into mosaic.toml."
when = { variable = "AZDO_AUTH_METHOD", in = ["service-principal"] }

[[notes]]
text = "managed-identity só funciona numa VM do Azure (IMDS)."
text_en = "managed-identity only works on an Azure VM (IMDS)."
when = { variable = "AZDO_AUTH_METHOD", in = ["managed-identity"] }

[[notes]]
text = "catálogo: o arquivo é lido a cada atualização. Para ver o que ele e a escolha selecionam, sem rede: python3 ~/.config/mosaic/plugins/azure-pipelines/azure_pipelines.py pipelines (com as mesmas variáveis do widget)."
text_en = "catalog: the file is read on every refresh. To see what it and the choice select, offline: python3 ~/.config/mosaic/plugins/azure-pipelines/azure_pipelines.py pipelines (with the same variables as the widget)."
when = { variable = "AZDO_PIPELINES_FILE", present = true }
