version = "0.0.5"
min_mosaic_version = "0.0.10"
plugin = "calendar"
script = "plugins/calendar/calendar_widget.py"
default_id = "agenda"
interval_seconds = 300
timeout_seconds = 20

[[steps]]
kind = "variable"
name = "CALENDAR_SOURCE"
prompt = "De onde vem a agenda"
prompt_en = "Where the calendar comes from"
type = "choice"
required = true
choices = [
  { value = "ics", description = "link ICS secreto; funciona em qualquer sistema e conta com o link liberado", description_en = "secret ICS link; works on any system and account that has the link enabled" },
  { value = "goa", description = "conta Google do GNOME (Contas Online); só Linux com GNOME", description_en = "GNOME Google account (Online Accounts); Linux with GNOME only" },
  { value = "gcalcli", description = "as agendas que o gcalcli já enxerga", description_en = "the calendars gcalcli already sees" },
]

[[steps]]
kind = "secret"
prompt = "Links ICS da agenda (cada link é um segredo: guarde-o numa variável de ambiente ou num arquivo com um link por linha)"
prompt_en = "Calendar ICS links (each link is a secret: keep it in an environment variable or in a file with one link per line)"
environment_key = "CALENDAR_ICS_URL_ENV"
file_key = "CALENDAR_ICS_URL_FILE"
list = true
both = true
required = true
when = { variable = "CALENDAR_SOURCE", in = ["ics"] }

[[steps]]
kind = "variable"
name = "CALENDAR_GOA_ACCOUNT"
prompt = "E-mail de uma conta Google específica (Enter = todas as contas com agenda)"
prompt_en = "Email of a specific Google account (Enter = every account with a calendar)"
when = { variable = "CALENDAR_SOURCE", in = ["goa"] }

[[steps]]
kind = "variable"
name = "CALENDAR_CALENDARS"
prompt = "Nomes das agendas (Enter = todas as agendas)"
prompt_en = "Calendar names (Enter = every calendar)"
type = "list"
when = { variable = "CALENDAR_SOURCE", in = ["goa", "gcalcli"] }

[[steps]]
kind = "variable"
name = "CALENDAR_TITLE"
prompt = "Título do widget"
prompt_en = "Widget title"
default = "Agenda"

[[inherit]]
name = "DBUS_SESSION_BUS_ADDRESS"
when = { variable = "CALENDAR_SOURCE", in = ["goa"] }

[[notes]]
text = "ics: quem tem o link lê a sua agenda; nunca o coloque no mosaic.toml. Cada link tem até 15 s para responder: com vários links, aumente timeout_seconds."
text_en = "ics: anyone with the link reads your calendar; never put it in mosaic.toml. Each link has up to 15 s to answer: with several links, raise timeout_seconds."
when = { variable = "CALENDAR_SOURCE", in = ["ics"] }

[[notes]]
text = "goa: a conta precisa estar em Configurações > Contas Online com Agenda ligada."
text_en = "goa: the account must be in Settings > Online Accounts with Calendar turned on."
when = { variable = "CALENDAR_SOURCE", in = ["goa"] }

[[notes]]
text = "gcalcli: precisa estar instalado e autenticado uma vez no terminal; se não estiver no PATH do widget, defina PATH em [widgets.env]."
text_en = "gcalcli: must be installed and authenticated once in the terminal; if it is not in the widget PATH, set PATH in [widgets.env]."
when = { variable = "CALENDAR_SOURCE", in = ["gcalcli"] }
