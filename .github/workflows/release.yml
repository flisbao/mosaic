name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A tag bate com a versão do Cargo.toml
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} diferente de v${version} (Cargo.toml)" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 -m unittest discover -s plugins/tests

  build:
    name: Compilar ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Instalar musl-tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: O binário executa
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/mosaic --version
      - name: Empacotar
        run: |
          name="mosaic-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "${name}"
          cp "target/${{ matrix.target }}/release/mosaic" README.md PROTOCOL.md PROTOCOL.pt-BR.md LICENSE "${name}/"
          cp -r schema "${name}/schema"
          tar -czf "${name}.tar.gz" "${name}"
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
      - name: Montar o .deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          deb="$(scripts/build-deb.sh "${GITHUB_REF_NAME}" "target/${{ matrix.target }}/release/mosaic" .)"
          sha256sum "$(basename "${deb}")" > "$(basename "${deb}").sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-${{ matrix.target }}
          path: |
            mosaic-*.tar.gz
            mosaic-*.tar.gz.sha256
            mosaic_*.deb
            mosaic_*.deb.sha256

  release:
    name: Publicar a release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Calcular o SHA256SUMS
        run: |
          cd dist
          sha256sum mosaic-*.tar.gz mosaic_*.deb > SHA256SUMS
          for target in x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin x86_64-apple-darwin; do
            grep -q "mosaic-${GITHUB_REF_NAME}-${target}.tar.gz" SHA256SUMS
          done
      - name: Gerar a fórmula do Homebrew
        run: scripts/render-homebrew-formula.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS > dist/mosaic.rb
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
